[project]
name = "backtester"
version = "0.1.0"
description = "Event-driven backtesting engine with real quant strategies and walk-forward validation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Prashant" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
backtester = "backtester.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backtester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["error::RuntimeWarning"]
